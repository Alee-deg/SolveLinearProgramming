name: Build All Platforms

on:
  push:
    branches: [ master, main, Algorithm_of_Hau ]

permissions:
  contents: read

jobs:
  # ================================================================
  # WINDOWS
  # ================================================================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Lấy mã nguồn
      uses: actions/checkout@v4

    - name: 2. Cài đặt Qt 6.4.2 MinGW 64-bit
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2'
        arch: 'win64_mingw'
        tools: 'tools_mingw90'
        add-tools-to-path: true

    - name: 3. Build bằng CMake + MinGW
      shell: pwsh
      run: |
        cmake -B build -G "MinGW Makefiles" `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
        cmake --build build --config Release --parallel 2

    - name: 4. Deploy - Copy DLL và plugin
      shell: pwsh
      run: |
        $qtBin    = "$env:Qt6_DIR\bin"
        $qtPlugin = "$env:Qt6_DIR\plugins"
        $outDir   = "build_result"

        $libgcc = Get-ChildItem -Path $env:IQTA_TOOLS `
                    -Filter "libgcc_s_seh-1.dll" -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1
        $mingwBin = if ($libgcc) { $libgcc.DirectoryName } else {
          Split-Path (Get-Command gcc -ErrorAction SilentlyContinue).Source
        }
        Write-Host "MinGW bin: $mingwBin"

        New-Item -ItemType Directory -Force -Path $outDir

        if (Test-Path "build\SolveLinearProgramming.exe") {
          Copy-Item "build\SolveLinearProgramming.exe" "$outDir\"
        } else {
          Copy-Item "build\Release\SolveLinearProgramming.exe" "$outDir\"
        }
        Write-Host "[OK] exe"

        if (Test-Path "settings.ini") {
          Copy-Item "settings.ini" "$outDir\"
          Write-Host "[OK] settings.ini"
        }

        $qtDlls = @(
          "Qt6Core.dll","Qt6Gui.dll","Qt6Widgets.dll",
          "Qt6Network.dll","Qt6PrintSupport.dll",
          "Qt6Svg.dll","Qt6Core5Compat.dll"
        )
        foreach ($dll in $qtDlls) {
          $src = Join-Path $qtBin $dll
          if (Test-Path $src) { Copy-Item $src "$outDir\"; Write-Host "[OK] $dll" }
          else { Write-Host "[SKIP] $dll" }
        }

        New-Item -ItemType Directory -Force -Path "$outDir\platforms"
        Copy-Item "$qtPlugin\platforms\qwindows.dll" "$outDir\platforms\"

        New-Item -ItemType Directory -Force -Path "$outDir\styles"
        if (Test-Path "$qtPlugin\styles\qwindowsvistastyle.dll") {
          Copy-Item "$qtPlugin\styles\qwindowsvistastyle.dll" "$outDir\styles\"
        }

        New-Item -ItemType Directory -Force -Path "$outDir\iconengines"
        foreach ($f in Get-ChildItem "$qtPlugin\iconengines\*.dll" -ErrorAction SilentlyContinue) {
          Copy-Item $f.FullName "$outDir\iconengines\"
        }

        New-Item -ItemType Directory -Force -Path "$outDir\imageformats"
        foreach ($f in Get-ChildItem "$qtPlugin\imageformats\*.dll" -ErrorAction SilentlyContinue) {
          Copy-Item $f.FullName "$outDir\imageformats\"
        }

        if (Test-Path "$qtPlugin\platformthemes") {
          New-Item -ItemType Directory -Force -Path "$outDir\platformthemes"
          foreach ($f in Get-ChildItem "$qtPlugin\platformthemes\*.dll" -ErrorAction SilentlyContinue) {
            Copy-Item $f.FullName "$outDir\platformthemes\"
          }
        }

        if (Test-Path "$qtPlugin\tls") {
          New-Item -ItemType Directory -Force -Path "$outDir\tls"
          foreach ($f in Get-ChildItem "$qtPlugin\tls\*.dll" -ErrorAction SilentlyContinue) {
            Copy-Item $f.FullName "$outDir\tls\"
          }
        }

        foreach ($dll in @("libssl-3-x64.dll","libcrypto-3-x64.dll","libssl-1_1-x64.dll","libcrypto-1_1-x64.dll")) {
          foreach ($src in @("$qtBin\$dll","$mingwBin\$dll","C:\Program Files\Git\mingw64\bin\$dll")) {
            if (Test-Path $src) { Copy-Item $src "$outDir\"; Write-Host "[OK] $dll"; break }
          }
        }

        foreach ($dll in @("libgcc_s_seh-1.dll","libstdc++-6.dll","libwinpthread-1.dll")) {
          $src = Join-Path $mingwBin $dll
          if (Test-Path $src) { Copy-Item $src "$outDir\"; Write-Host "[OK] $dll" }
          else { Write-Host "[WARN] $dll not found" }
        }

        @("[Paths]","Prefix = .","Plugins = .") | Set-Content "$outDir\qt.conf"

        @(
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
          '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">',
          '  <application xmlns="urn:schemas-microsoft-com:asm.v3">',
          '    <windowsSettings>',
          '      <dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">PerMonitorV2</dpiAware>',
          '      <dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness>',
          '    </windowsSettings>',
          '  </application>',
          '</assembly>'
        ) | Set-Content "$outDir\SolveLinearProgramming.exe.manifest"

        Write-Host "[OK] Windows deploy done"

    - name: 4.1. Đóng gói Tectonic và cache LaTeX cho Windows
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"
        $outDir = "build_result"
        $toolsDir = Join-Path $outDir "tools"
        $cacheDir = Join-Path $outDir "tectonic-cache"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
        New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

        # [FONT FIX] Đóng gói Noto Serif để PDF LaTeX hiển thị đúng tiếng Việt trên mọi máy.
        $fontsDir = Join-Path $outDir "fonts"
        $notoDir = "noto-fonts"
        New-Item -ItemType Directory -Force -Path $fontsDir | Out-Null
        New-Item -ItemType Directory -Force -Path $notoDir | Out-Null
        foreach ($style in @("Regular","Bold","Italic","BoldItalic")) {
          $url = "https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSerif/NotoSerif-$style.ttf"
          $target = Join-Path $notoDir "NotoSerif-$style.ttf"
          Invoke-WebRequest -Uri $url -OutFile $target -Headers @{ "User-Agent" = "PhanMemQHTT-GitHub-Actions" }
          Copy-Item $target (Join-Path $fontsDir "NotoSerif-$style.ttf") -Force
        }
        Write-Host "[OK] Bundled Noto Serif fonts: $fontsDir"

        $headers = @{
          "Accept" = "application/vnd.github+json"
          "User-Agent" = "PhanMemQHTT-GitHub-Actions"
          "Authorization" = "Bearer $env:GITHUB_TOKEN"
        }

        Write-Host "[INFO] Download latest Tectonic for Windows..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tectonic-typesetting/tectonic/releases/latest" -Headers $headers
        $asset = $release.assets |
          Where-Object { $_.name -match "x86_64-pc-windows-msvc.*\.zip$" } |
          Select-Object -First 1

        if (-not $asset) {
          Write-Host "[ERROR] Không tìm thấy asset Tectonic Windows x86_64-pc-windows-msvc"
          $release.assets | ForEach-Object { Write-Host $_.name }
          exit 1
        }

        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "tectonic-windows.zip" -Headers @{
          "User-Agent" = "PhanMemQHTT-GitHub-Actions"
        }
        Expand-Archive -Path "tectonic-windows.zip" -DestinationPath "tectonic-windows" -Force

        $tectonicExe = Get-ChildItem -Path "tectonic-windows" -Recurse -Filter "tectonic.exe" |
          Select-Object -First 1

        if (-not $tectonicExe) {
          Write-Host "[ERROR] Không tìm thấy tectonic.exe sau khi giải nén"
          exit 1
        }

        Copy-Item $tectonicExe.FullName (Join-Path $toolsDir "tectonic.exe") -Force
        & (Join-Path $toolsDir "tectonic.exe") --version

        $warmup = @'
        \documentclass[12pt,a4paper]{article}
        \usepackage{fontspec}
        \usepackage[vietnamese]{babel}
        \usepackage{amsmath, geometry, array, amssymb, xcolor}
        \setmainfont{NotoSerif}[
          Path={noto-fonts/},
          UprightFont=*-Regular.ttf,
          BoldFont=*-Bold.ttf,
          ItalicFont=*-Italic.ttf,
          BoldItalicFont=*-BoldItalic.ttf
        ]
        \geometry{margin=1in}
        \sloppy
        \emergencystretch=2em
        \begin{document}
        \section*{Kiem tra cache LaTeX}
        Kiem tra bien dich bao cao quy hoach tuyen tinh.
        \[
        \begin{array}{r c r c r l}
        -Z &=& 0.00 &+& x_{1}\\
        \hline
        w_{1} &=& 1.00 &-& x_{1}
        \end{array}
        \]
        \textcolor{red}{$w_1$} \quad \textcolor{green!50!black}{$x_1$}
        \end{document}
        '@

        $warmupPath = "tectonic-warmup.tex"
        $warmupOut = "tectonic-warmup-out"
        New-Item -ItemType Directory -Force -Path $warmupOut | Out-Null
        $warmup | Set-Content -Path $warmupPath -Encoding UTF8
        $env:TECTONIC_CACHE_DIR = (Resolve-Path $cacheDir).Path

        & (Join-Path $toolsDir "tectonic.exe") --chatter minimal --outdir $warmupOut $warmupPath
        if ($LASTEXITCODE -ne 0) {
          Write-Host "[ERROR] Warm-up Tectonic cache failed"
          exit 1
        }

        Write-Host "[OK] Bundled Tectonic: $toolsDir\tectonic.exe"
        Write-Host "[OK] Preloaded Tectonic cache: $cacheDir"

    - name: 5. Cài đặt NSIS
      shell: pwsh
      run: |
        $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
        if (-not (Test-Path $nsisPath)) {
          choco install nsis -y --no-progress
        }
        Write-Host "[OK] NSIS ready"

    - name: 6. Tạo NSIS script và đóng gói thành 1 file .exe
      shell: pwsh
      run: |
        @(
          '; =====================================================',
          '; NSIS Script - Đóng gói SolveLinearProgramming',
          '; Tạo ra 1 file .exe duy nhất, tự giải nén và chạy',
          '; =====================================================',
          '!include "MUI2.nsh"',
          '!include "FileFunc.nsh"',
          '',
          '; Cấu hình output',
          'OutFile "PhanMemQHTT-Windows.exe"',
          'Name "Phần Mềm Giải Quy Hoạch Tuyến Tính"',
          'Icon "logo.ico"',
          'InstallDir "$TEMP\PhanMemQHTT"',
          'RequestExecutionLevel user',
          'SilentInstall silent',
          '',
          '; Không tạo shortcut, không hiện UI — chỉ giải nén và chạy',
          'Section "Run"',
          '  SetOutPath "$INSTDIR"',
          '  File /r "build_result\*.*"',
          '  System::Call ''Kernel32::SetEnvironmentVariable(t "TECTONIC_CACHE_DIR", t "$INSTDIR\tectonic-cache")i.r0''',
          '  System::Call ''Kernel32::SetEnvironmentVariable(t "PATH", t "$INSTDIR\tools;$%PATH%")i.r1''',
          '  ExecWait ''"$INSTDIR\SolveLinearProgramming.exe"''',
          '  RMDir /r "$INSTDIR"',
          'SectionEnd'
        ) | Set-Content -Path "installer.nsi" -Encoding UTF8

        $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
        & $nsisPath "installer.nsi"

        if (Test-Path "PhanMemQHTT-Windows.exe") {
          $size = (Get-Item "PhanMemQHTT-Windows.exe").Length / 1MB
          Write-Host "[OK] PhanMemQHTT-Windows.exe ($([math]::Round($size,1)) MB)"
        } else {
          Write-Host "[ERROR] Build thất bại!"
          exit 1
        }

    - name: 7. Upload artifact Windows
      uses: actions/upload-artifact@v4
      with:
        name: PhanMemQHTT-Windows
        path: PhanMemQHTT-Windows.exe
        if-no-files-found: error


  # ================================================================
  # LINUX
  # ================================================================
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Lấy mã nguồn
      uses: actions/checkout@v4

    - name: 2. Cài đặt Qt 6.4.2
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2'
        arch: 'gcc_64'
        host: 'linux'

    - name: 3. Cài đặt system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libgl1-mesa-dev libglu1-mesa-dev \
          libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xfixes0 libxcb-cursor0 \
          libxkbcommon-x11-0 libdbus-1-3 \
          libfontconfig1 libfreetype6 fontconfig \
          fonts-dejavu-core fonts-liberation \
          libssl-dev openssl ca-certificates \
          curl wget tar gzip xz-utils python3 \
          patchelf file

    - name: 4. Build bằng CMake + GCC
      run: |
        cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$Qt6_DIR"
        cmake --build build --parallel 2

    - name: 5. Deploy - Tạo AppImage
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/lib
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p AppDir/usr/bin/tools
        mkdir -p AppDir/usr/share/tectonic-cache
        mkdir -p AppDir/usr/share/fonts/phanmemqhtt
        mkdir -p noto-fonts

        # [FONT FIX] Đóng gói Noto Serif để PDF LaTeX hiển thị đúng tiếng Việt trên mọi máy.
        for style in Regular Bold Italic BoldItalic; do
          curl -L --retry 3 --fail             -o "noto-fonts/NotoSerif-${style}.ttf"             "https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSerif/NotoSerif-${style}.ttf"
          cp "noto-fonts/NotoSerif-${style}.ttf" "AppDir/usr/share/fonts/phanmemqhtt/NotoSerif-${style}.ttf"
        done
        echo "[OK] Bundled Noto Serif fonts into AppImage"

        cp -L /usr/lib/x86_64-linux-gnu/libssl.so* AppDir/usr/lib/ 2>/dev/null || true
        cp -L /usr/lib/x86_64-linux-gnu/libcrypto.so* AppDir/usr/lib/ 2>/dev/null || true

        cp build/SolveLinearProgramming AppDir/usr/bin/

        python3 <<'PY'
        import json, re, tarfile, urllib.request, pathlib, sys, os

        token = os.environ.get("GITHUB_TOKEN", "")
        headers = {
            "Accept": "application/vnd.github+json",
            "User-Agent": "PhanMemQHTT-GitHub-Actions",
        }
        if token:
            headers["Authorization"] = f"Bearer {token}"

        api = "https://api.github.com/repos/tectonic-typesetting/tectonic/releases/latest"
        req = urllib.request.Request(api, headers=headers)
        release = json.load(urllib.request.urlopen(req))
        assets = release.get("assets", [])

        def pick(patterns):
            for pattern in patterns:
                for asset in assets:
                    if re.search(pattern, asset["name"]):
                        return asset
            return None

        asset = pick([
            r"x86_64-unknown-linux-musl.*\.tar\.gz$",
            r"x86_64-unknown-linux-gnu.*\.tar\.gz$",
        ])

        if not asset:
            print("[ERROR] Không tìm thấy asset Tectonic Linux x86_64", file=sys.stderr)
            for a in assets:
                print(a["name"])
            sys.exit(1)

        archive = pathlib.Path("tectonic-linux.tar.gz")
        print("[INFO] Download:", asset["name"])
        urllib.request.urlretrieve(asset["browser_download_url"], archive)

        out_dir = pathlib.Path("tectonic-linux")
        out_dir.mkdir(exist_ok=True)
        with tarfile.open(archive, "r:gz") as tar:
            tar.extractall(out_dir)

        candidates = list(out_dir.rglob("tectonic"))
        if not candidates:
            print("[ERROR] Không tìm thấy binary tectonic", file=sys.stderr)
            sys.exit(1)

        target = pathlib.Path("AppDir/usr/bin/tools/tectonic.bin")
        target.write_bytes(candidates[0].read_bytes())
        target.chmod(0o755)
        print("[OK] Bundled Tectonic binary:", target)
        PY

        cat > AppDir/usr/bin/tools/tectonic <<'EOF'
        #!/usr/bin/env bash
        DIR="$(cd "$(dirname "$0")" && pwd)"
        SEED_DIR="$DIR/../../share/tectonic-cache"
        CACHE_BASE="${XDG_CACHE_HOME:-$HOME/.cache}"
        USER_CACHE="$CACHE_BASE/PhanMemQHTT/tectonic-cache"

        mkdir -p "$USER_CACHE"

        if [ -d "$SEED_DIR" ] && [ ! -f "$USER_CACHE/.phanmemqhtt_seeded" ]; then
          cp -R "$SEED_DIR"/. "$USER_CACHE"/ 2>/dev/null || true
          touch "$USER_CACHE/.phanmemqhtt_seeded" 2>/dev/null || true
        fi

        export TECTONIC_CACHE_DIR="$USER_CACHE"
        exec "$DIR/tectonic.bin" "$@"
        EOF

        chmod +x AppDir/usr/bin/tools/tectonic AppDir/usr/bin/tools/tectonic.bin
        AppDir/usr/bin/tools/tectonic.bin --version

        cat > tectonic-warmup.tex <<'EOF'
        \documentclass[12pt,a4paper]{article}
        \usepackage{fontspec}
        \usepackage[vietnamese]{babel}
        \usepackage{amsmath, geometry, array, amssymb, xcolor}
        \setmainfont{NotoSerif}[
          Path={noto-fonts/},
          UprightFont=*-Regular.ttf,
          BoldFont=*-Bold.ttf,
          ItalicFont=*-Italic.ttf,
          BoldItalicFont=*-BoldItalic.ttf
        ]
        \geometry{margin=1in}
        \sloppy
        \emergencystretch=2em
        \begin{document}
        \section*{Kiem tra cache LaTeX}
        Kiem tra bien dich bao cao quy hoach tuyen tinh.
        \[
        \begin{array}{r c r c r l}
        -Z &=& 0.00 &+& x_{1}\\
        \hline
        w_{1} &=& 1.00 &-& x_{1}
        \end{array}
        \]
        \textcolor{red}{$w_1$} \quad \textcolor{green!50!black}{$x_1$}
        \end{document}
        EOF

        export TECTONIC_CACHE_DIR="$PWD/AppDir/usr/share/tectonic-cache"
        mkdir -p tectonic-warmup-out
        AppDir/usr/bin/tools/tectonic.bin --chatter minimal --outdir tectonic-warmup-out tectonic-warmup.tex
        echo "[OK] Preloaded Tectonic cache into AppImage"

        if [ -f "settings.ini" ]; then
          cp settings.ini AppDir/usr/bin/
          echo "[OK] Copied settings.ini"
        fi

        echo "[Desktop Entry]" > AppDir/usr/share/applications/SolveLinearProgramming.desktop
        echo "Name=Giải Quy Hoạch Tuyến Tính" >> AppDir/usr/share/applications/SolveLinearProgramming.desktop
        echo "Exec=SolveLinearProgramming" >> AppDir/usr/share/applications/SolveLinearProgramming.desktop
        echo "Icon=SolveLinearProgramming" >> AppDir/usr/share/applications/SolveLinearProgramming.desktop
        echo "Type=Application" >> AppDir/usr/share/applications/SolveLinearProgramming.desktop
        echo "Categories=Education;Science;" >> AppDir/usr/share/applications/SolveLinearProgramming.desktop

        if [ -f "resources/icon.png" ]; then
          cp resources/icon.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/SolveLinearProgramming.png
        else
          convert -size 256x256 xc:#0078D7 \
            -font DejaVu-Sans-Bold -pointsize 60 \
            -fill white -gravity center \
            -annotate 0 "QHTT" \
            AppDir/usr/share/icons/hicolor/256x256/apps/SolveLinearProgramming.png 2>/dev/null || \
          cp /usr/share/pixmaps/gnome-terminal.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/SolveLinearProgramming.png 2>/dev/null || true
        fi

        echo "[Paths]" > AppDir/usr/bin/qt.conf
        echo "Prefix = .." >> AppDir/usr/bin/qt.conf
        echo "Plugins = plugins" >> AppDir/usr/bin/qt.conf
        echo "Libraries = lib" >> AppDir/usr/bin/qt.conf

        QT_PLUGIN_SRC="$Qt6_DIR/plugins"
        QT_PLUGIN_DST="AppDir/usr/plugins"

        for dir in styles platformthemes iconengines imageformats tls; do
          mkdir -p "$QT_PLUGIN_DST/$dir"
          cp "$QT_PLUGIN_SRC/$dir/"*.so "$QT_PLUGIN_DST/$dir/" 2>/dev/null || true
        done

        mv AppDir/usr/bin/SolveLinearProgramming AppDir/usr/bin/SolveLinearProgramming.bin

        echo '#!/bin/bash' > AppDir/usr/bin/SolveLinearProgramming
        echo 'APPDIR="$(dirname "$(readlink -f "$0")")/../.."' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export QT_AUTO_SCREEN_SCALE_FACTOR=1' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export QT_ENABLE_HIGHDPI_SCALING=1' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export QT_SCALE_FACTOR_ROUNDING_POLICY=PassThrough' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export QT_QPA_PLATFORMTHEME="${QT_QPA_PLATFORMTHEME:-gtk3}"' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export QT_STYLE_OVERRIDE="${QT_STYLE_OVERRIDE:-Fusion}"' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export QT_PLUGIN_PATH="$APPDIR/usr/plugins:$QT_PLUGIN_PATH"' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export LD_LIBRARY_PATH="$APPDIR/usr/lib:$LD_LIBRARY_PATH"' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export PATH="$APPDIR/usr/bin/tools:$APPDIR/usr/bin:$PATH"' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"' >> AppDir/usr/bin/SolveLinearProgramming
        echo 'exec "$APPDIR/usr/bin/SolveLinearProgramming.bin" "$@"' >> AppDir/usr/bin/SolveLinearProgramming

        chmod +x AppDir/usr/bin/SolveLinearProgramming

        export QMAKE="$Qt6_DIR/bin/qmake"
        export OUTPUT="PhanMemQHTT-Linux-x86_64.AppImage"
        export LINUXDEPLOY_OUTPUT_VERSION=""
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --plugin qt \
          --output appimage

        if [ -f "PhanMemQHTT-Linux-x86_64.AppImage" ]; then
          echo "[OK] $(ls -lh PhanMemQHTT-Linux-x86_64.AppImage)"
        else
          FOUND=$(find . -maxdepth 1 -name "*.AppImage" \
                    ! -name "linuxdeploy-x86_64.AppImage" \
                    ! -name "linuxdeploy-plugin-qt-x86_64.AppImage" | head -1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" PhanMemQHTT-Linux-x86_64.AppImage
            echo "[OK] Renamed from $FOUND"
          else
            echo "[ERROR] Không tìm thấy AppImage!"
            ls -la *.AppImage 2>/dev/null
            exit 1
          fi
        fi

    - name: 6. Upload artifact Linux
      uses: actions/upload-artifact@v4
      with:
        name: PhanMemQHTT-Linux
        path: PhanMemQHTT-Linux-x86_64.AppImage
        if-no-files-found: error


  # ================================================================
  # MACOS
  # ================================================================
  build-macos:
    runs-on: macos-latest

    steps:
    - name: 1. Lấy mã nguồn
      uses: actions/checkout@v4

    - name: 2. Cài đặt Qt 6.4.2
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2'
        host: 'mac'
        arch: 'clang_64'

    - name: 3. Build bằng CMake + Clang
      run: |
        cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
              -DCMAKE_INSTALL_RPATH="@executable_path/../Frameworks" \
              -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
        cmake --build build --parallel 3

    - name: 4. Deploy - macdeployqt + tạo DMG
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        APP_NAME="SolveLinearProgramming"
        OUT_DIR="build_result"
        mkdir -p "$OUT_DIR"

        APP_BUNDLE="build/${APP_NAME}.app"
        if [ ! -d "$APP_BUNDLE" ]; then
          APP_BUNDLE=$(find build -name "*.app" -type d | head -1)
          echo "[INFO] Found: $APP_BUNDLE"
        fi

        if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
          echo "[ERROR] Không tìm thấy .app bundle!"
          find build -type d -name "*.app" 2>/dev/null
          exit 1
        fi

        if [ -f "settings.ini" ]; then
          cp settings.ini "$APP_BUNDLE/Contents/MacOS/"
          echo "[OK] Copied settings.ini"
        fi

        mkdir -p "$APP_BUNDLE/Contents/Frameworks"
        if [ -d "$Qt6_DIR/lib/QtPrintSupport.framework" ]; then
          cp -R "$Qt6_DIR/lib/QtPrintSupport.framework" \
                "$APP_BUNDLE/Contents/Frameworks/"
          echo "[OK] QtPrintSupport copied"
        fi

        "$Qt6_DIR/bin/macdeployqt" "$APP_BUNDLE" -verbose=1
        echo "[OK] macdeployqt done"

        TOOLS_DIR="$APP_BUNDLE/Contents/Resources/tools"
        export TOOLS_DIR
        mkdir -p "$TOOLS_DIR"
        mkdir -p "$APP_BUNDLE/Contents/Resources/fonts"
        mkdir -p noto-fonts

        # [FONT FIX] Đóng gói Noto Serif để PDF LaTeX hiển thị đúng tiếng Việt trên mọi máy.
        for style in Regular Bold Italic BoldItalic; do
          curl -L --retry 3 --fail             -o "noto-fonts/NotoSerif-${style}.ttf"             "https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSerif/NotoSerif-${style}.ttf"
          cp "noto-fonts/NotoSerif-${style}.ttf" "$APP_BUNDLE/Contents/Resources/fonts/NotoSerif-${style}.ttf"
        done
        echo "[OK] Bundled Noto Serif fonts into macOS app"

        python3 <<'PY'
        import json, re, tarfile, urllib.request, pathlib, sys, shutil, os

        token = os.environ.get("GITHUB_TOKEN", "")
        headers = {
            "Accept": "application/vnd.github+json",
            "User-Agent": "PhanMemQHTT-GitHub-Actions",
        }
        if token:
            headers["Authorization"] = f"Bearer {token}"

        api = "https://api.github.com/repos/tectonic-typesetting/tectonic/releases/latest"
        req = urllib.request.Request(api, headers=headers)
        release = json.load(urllib.request.urlopen(req))
        assets = release.get("assets", [])

        targets = {
            "x86_64": [r"x86_64-apple-darwin.*\.tar\.gz$"],
            "arm64":  [r"aarch64-apple-darwin.*\.tar\.gz$", r"arm64-apple-darwin.*\.tar\.gz$"],
        }

        tools_dir = pathlib.Path(os.environ["TOOLS_DIR"])
        tools_dir.mkdir(parents=True, exist_ok=True)

        def pick(patterns):
            for pattern in patterns:
                for asset in assets:
                    if re.search(pattern, asset["name"]):
                        return asset
            return None

        downloaded = []
        for arch, patterns in targets.items():
            asset = pick(patterns)
            if not asset:
                print(f"[WARN] Không tìm thấy Tectonic macOS {arch}")
                continue

            archive = pathlib.Path(f"tectonic-macos-{arch}.tar.gz")
            out_dir = pathlib.Path(f"tectonic-macos-{arch}")
            print("[INFO] Download:", asset["name"])
            urllib.request.urlretrieve(asset["browser_download_url"], archive)
            out_dir.mkdir(exist_ok=True)
            with tarfile.open(archive, "r:gz") as tar:
                tar.extractall(out_dir)

            candidates = list(out_dir.rglob("tectonic"))
            if candidates:
                target = tools_dir / f"tectonic-{arch}"
                shutil.copy2(candidates[0], target)
                target.chmod(0o755)
                downloaded.append(arch)
                print("[OK] Bundled:", target)

        if not downloaded:
            print("[ERROR] Không tải được Tectonic cho macOS", file=sys.stderr)
            for a in assets:
                print(a["name"])
            sys.exit(1)
        PY

        cat > "$TOOLS_DIR/tectonic" <<'EOF'
        #!/bin/bash
        DIR="$(cd "$(dirname "$0")" && pwd)"
        SEED_DIR="$DIR/../tectonic-cache"

        if [ -z "$TECTONIC_CACHE_DIR" ]; then
          USER_CACHE="$HOME/Library/Caches/PhanMemQHTT/tectonic-cache"
          mkdir -p "$USER_CACHE"

          if [ -d "$SEED_DIR" ] && [ ! -f "$USER_CACHE/.phanmemqhtt_seeded" ]; then
            cp -R "$SEED_DIR"/. "$USER_CACHE"/ 2>/dev/null || true
            touch "$USER_CACHE/.phanmemqhtt_seeded" 2>/dev/null || true
          fi

          export TECTONIC_CACHE_DIR="$USER_CACHE"
        fi

        ARCH="$(uname -m)"
        if [ "$ARCH" = "arm64" ] && [ -x "$DIR/tectonic-arm64" ]; then
          exec "$DIR/tectonic-arm64" "$@"
        fi
        if [ -x "$DIR/tectonic-x86_64" ]; then
          exec "$DIR/tectonic-x86_64" "$@"
        fi
        if [ -x "$DIR/tectonic-arm64" ]; then
          exec "$DIR/tectonic-arm64" "$@"
        fi
        echo "No bundled tectonic binary found" >&2
        exit 127
        EOF

        chmod +x "$TOOLS_DIR/tectonic" "$TOOLS_DIR"/tectonic-* 2>/dev/null || true
        "$TOOLS_DIR/tectonic" --version

        SEED_CACHE="$APP_BUNDLE/Contents/Resources/tectonic-cache"
        mkdir -p "$SEED_CACHE"
        cat > tectonic-warmup.tex <<'EOF'
        \documentclass[12pt,a4paper]{article}
        \usepackage{fontspec}
        \usepackage[vietnamese]{babel}
        \usepackage{amsmath, geometry, array, amssymb, xcolor}
        \setmainfont{NotoSerif}[
          Path={noto-fonts/},
          UprightFont=*-Regular.ttf,
          BoldFont=*-Bold.ttf,
          ItalicFont=*-Italic.ttf,
          BoldItalicFont=*-BoldItalic.ttf
        ]
        \geometry{margin=1in}
        \sloppy
        \emergencystretch=2em
        \begin{document}
        \section*{Kiem tra cache LaTeX}
        Kiem tra bien dich bao cao quy hoach tuyen tinh.
        \[
        \begin{array}{r c r c r l}
        -Z &=& 0.00 &+& x_{1}\\
        \hline
        w_{1} &=& 1.00 &-& x_{1}
        \end{array}
        \]
        \textcolor{red}{$w_1$} \quad \textcolor{green!50!black}{$x_1$}
        \end{document}
        EOF

        export TECTONIC_CACHE_DIR="$SEED_CACHE"
        mkdir -p tectonic-warmup-out
        "$TOOLS_DIR/tectonic" --chatter minimal --outdir tectonic-warmup-out tectonic-warmup.tex
        echo "[OK] Preloaded Tectonic cache into macOS app"

        codesign --force --deep -s - "$APP_BUNDLE"
        echo "[OK] Re-signed"

        DMG_STAGING="dmg_staging"
        mkdir -p "$DMG_STAGING"
        cp -R "$APP_BUNDLE" "$DMG_STAGING/"
        sync && sleep 2

        hdiutil create \
          -volname "Giai QHTT" \
          -srcfolder "$DMG_STAGING" \
          -ov -format UDZO \
          "$OUT_DIR/PhanMemQHTT-macOS.dmg"

        echo "[OK] $(ls -lh $OUT_DIR/PhanMemQHTT-macOS.dmg)"

    - name: 5. Upload artifact macOS
      uses: actions/upload-artifact@v4
      with:
        name: PhanMemQHTT-macOS
        path: build_result/PhanMemQHTT-macOS.dmg
        if-no-files-found: error
